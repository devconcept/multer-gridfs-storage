version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # Batch minor and patch bumps into a single PR to cut down on noise.
      # Major updates still open as individual PRs so they can be reviewed on their own.
      minor-and-patch:
        update-types:
          - minor
          - patch
