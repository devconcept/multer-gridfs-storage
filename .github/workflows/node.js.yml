name: build

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

permissions:
  contents: read

jobs:
  default:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [ 22.x, 24.x ]
        # MongoDB 8.0 refuses to start on Linux kernels 6.19 to 7.0.13 (SERVER-121912), which
        # GitHub runners currently use. Move back to 8.0 once runners ship kernel 7.0.14+.
        mongodb-version: [ '7.0' ]
    env:
      MONGODB_IMAGE: mongo:${{ matrix.mongodb-version }}
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - name: Start MongoDB
        run: |
          docker run --name mongodb --publish 27017:27017 --detach "$MONGODB_IMAGE"
          for i in $(seq 1 30); do
            docker exec mongodb mongosh --quiet --eval "db.runCommand({ ping: 1 })" >/dev/null 2>&1 && exit 0
            sleep 1
          done
          docker ps -a --filter name=mongodb
          docker logs mongodb
          exit 1
      - run: npm ci
      - run: npm install multer --no-save
      - run: npm install mongodb --no-save
      - run: npm run compile
      - run: npm run typecheck
      - run: npm run coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./test-report.junit.xml
          report_type: test_results
